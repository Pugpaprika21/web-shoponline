<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Seller Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Mobile header -->
    <div class="md:hidden fixed top-0 left-0 right-0 bg-teal-800 h-14 flex items-center justify-between px-4 z-40">
        <div class="flex items-center">
            <button onclick="toggleSidebar()" class="text-white p-1" aria-label="Toggle sidebar">
                <span class="material-icons">menu</span>
            </button>
            <a href="/seller" class="text-white font-bold ml-3 text-lg">Seller Dashboard</a>
        </div>
        <button onclick="logout()" class="text-teal-200 hover:text-white p-1" aria-label="Logout">
            <span class="material-icons text-sm">logout</span>
        </button>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <div class="flex">
        <!-- Sidebar -->
        <aside id="seller-sidebar-container" class="w-64 bg-teal-800 min-h-screen fixed overflow-y-auto z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <div class="p-4">
                <a href="/seller" class="text-white text-xl font-bold flex items-center gap-2">
                    <span class="material-icons">storefront</span> Seller Panel
                </a>
            </div>
            <nav class="mt-4">
                <a href="/seller" class="flex items-center px-4 py-2.5 text-teal-100 hover:bg-teal-700 hover:text-white transition" id="nav-dashboard">
                    <span class="material-icons mr-3 text-sm">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a href="/seller/shop" class="flex items-center px-4 py-2.5 text-teal-100 hover:bg-teal-700 hover:text-white transition" id="nav-shop">
                    <span class="material-icons mr-3 text-sm">store</span>
                    <span>Shop Settings</span>
                </a>
                <a href="/seller/products" class="flex items-center px-4 py-2.5 text-teal-100 hover:bg-teal-700 hover:text-white transition" id="nav-products">
                    <span class="material-icons mr-3 text-sm">inventory_2</span>
                    <span>Products</span>
                </a>
                <a href="/seller/orders" class="flex items-center px-4 py-2.5 text-teal-100 hover:bg-teal-700 hover:text-white transition" id="nav-orders">
                    <span class="material-icons mr-3 text-sm">shopping_cart</span>
                    <span>Orders</span>
                </a>
            </nav>
            <!-- Fixed bottom actions -->
            <div class="mt-4 border-t border-teal-600 pt-2">
                <a href="/" class="flex items-center px-4 py-3 text-teal-200 hover:bg-teal-700 hover:text-white transition">
                    <span class="material-icons mr-3 text-sm">arrow_back</span>
                    <span>Back to Store</span>
                </a>
                <button onclick="logout()" class="flex items-center px-4 py-3 text-teal-200 hover:bg-teal-700 hover:text-white w-full text-left transition">
                    <span class="material-icons mr-3 text-sm">logout</span>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 md:p-8 md:ml-64 mt-14 md:mt-0 min-w-0">
            {{embed}}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    $(document).ready(function() {
        highlightActiveNav();
    });

    function highlightActiveNav() {
        var path = window.location.pathname;
        $('nav a').each(function() {
            var href = $(this).attr('href');
            if (path === href || (href !== '/seller' && path.startsWith(href))) {
                $(this).addClass('bg-teal-700 text-white');
            }
        });
        // Exact match for dashboard
        if (path === '/seller') {
            $('#nav-dashboard').addClass('bg-teal-700 text-white');
        }
    }

    function toggleSidebar() {
        var sidebar = document.getElementById('seller-sidebar-container');
        var overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    }

    function logout() {
        api('POST', '/api/auth/logout').always(function() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        });
    }
    </script>
</body>
</html>
