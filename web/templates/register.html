<div class="max-w-md mx-auto mt-8 sm:mt-16 px-2 sm:px-0">
    <div class="bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Account</h2>

        <div id="register-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="register-success" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <form id="register-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                <input type="text" name="full_name" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="John Doe">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="your@email.com">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required minlength="6"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="••••••••  (min 6 characters)">
            </div>
            <button type="submit" id="register-btn"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
                Register
            </button>
        </form>

        <p class="text-center text-gray-500 text-sm mt-4">
            Already have an account? <a href="/login" class="text-indigo-600 hover:underline">Login</a>
        </p>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#register-form').on('submit', function(e) {
        e.preventDefault();
        $('#register-error').addClass('hidden');
        $('#register-btn').prop('disabled', true).text('Creating account...');

        $.ajax({
            url: '/api/auth/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                full_name: $('input[name="full_name"]').val(),
                email: $('input[name="email"]').val(),
                password: $('input[name="password"]').val()
            }),
            success: function() {
                $('#register-success').text('Account created! Redirecting to login...').removeClass('hidden');
                setTimeout(function() {
                    window.location.href = '/login';
                }, 1000);
            },
            error: function(xhr) {
                var error = xhr.responseJSON ? xhr.responseJSON.error : 'Registration failed';
                $('#register-error').text(error).removeClass('hidden');
                $('#register-btn').prop('disabled', false).text('Register');
            }
        });
    });
});
</script>
