<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ShopOnline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
                <p class="text-gray-500 text-sm mt-1">Sign in to manage your store</p>
            </div>

            <div id="login-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

            <form id="admin-login-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" name="email" required value="admin@shoponline.com"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-gray-500 focus:border-gray-500"
                        placeholder="admin@shoponline.com">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-gray-500 focus:border-gray-500"
                        placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-gray-800 text-white py-2 rounded-lg hover:bg-gray-700 transition font-medium">
                    Sign In
                </button>
            </form>

            <p class="text-center text-gray-400 text-xs mt-6">
                <a href="/" class="hover:text-gray-600">&larr; Back to Store</a>
            </p>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $('#admin-login-form').on('submit', function(e) {
            e.preventDefault();
            $('#login-error').addClass('hidden');
            $('#login-btn').prop('disabled', true).text('Signing in...');

            $.ajax({
                url: '/api/auth/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    email: $('input[name="email"]').val(),
                    password: $('input[name="password"]').val()
                }),
                success: function(response) {
                    if (response.token) {
                        localStorage.setItem('token', response.token);
                    }
                    if (response.data && response.data.role_name === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        $('#login-error').text('Admin access required. This account does not have admin privileges.').removeClass('hidden');
                        $('#login-btn').prop('disabled', false).text('Sign In');
                        // Logout non-admin
                        $.post('/api/auth/logout');
                    }
                },
                error: function(xhr) {
                    var error = xhr.responseJSON ? xhr.responseJSON.error : 'Login failed';
                    $('#login-error').text(error).removeClass('hidden');
                    $('#login-btn').prop('disabled', false).text('Sign In');
                }
            });
        });
    });
    </script>
</body>
</html>
