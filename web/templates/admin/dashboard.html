<!-- Dashboard Header -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-3">
    <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
    <div class="flex items-center gap-2">
        <select id="period-select" onchange="loadDashboard()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last year</option>
        </select>
    </div>
</div>

<!-- Stats Cards -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 uppercase">Revenue</p>
                <p class="text-xl font-bold text-gray-900 mt-1" id="stat-revenue">฿0</p>
            </div>
            <span class="material-icons text-green-500 text-2xl">trending_up</span>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 uppercase">Orders</p>
                <p class="text-xl font-bold text-gray-900 mt-1" id="stat-orders">0</p>
            </div>
            <span class="material-icons text-blue-500 text-2xl">shopping_cart</span>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 uppercase">Products</p>
                <p class="text-xl font-bold text-gray-900 mt-1" id="stat-products">0</p>
            </div>
            <span class="material-icons text-purple-500 text-2xl">inventory_2</span>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 uppercase">Users</p>
                <p class="text-xl font-bold text-gray-900 mt-1" id="stat-users">0</p>
            </div>
            <span class="material-icons text-orange-500 text-2xl">people</span>
        </div>
    </div>
</div>

<!-- Charts -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <!-- Revenue Chart -->
    <div class="bg-white rounded-lg shadow p-4 sm:p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Revenue Overview</h3>
        <canvas id="revenueChart" height="200"></canvas>
    </div>

    <!-- Orders Chart -->
    <div class="bg-white rounded-lg shadow p-4 sm:p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Orders by Status</h3>
        <canvas id="ordersChart" height="200"></canvas>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Top Products Chart -->
    <div class="bg-white rounded-lg shadow p-4 sm:p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Top Products (by stock)</h3>
        <canvas id="productsChart" height="200"></canvas>
    </div>

    <!-- Recent Orders -->
    <div class="bg-white rounded-lg shadow p-4 sm:p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Recent Orders</h3>
        <div id="recent-orders" class="space-y-3 max-h-64 overflow-y-auto">
            <p class="text-gray-400 text-sm">Loading...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
var revenueChart, ordersChart, productsChart;

$(document).ready(function() {
    loadDashboard();
});

function loadDashboard() {
    var days = $('#period-select').val();

    // Load stats
    api('GET', '/api/admin/orders').done(function(data) {
        var orders = data.data || [];
        var revenue = orders.reduce(function(sum, o) { return sum + o.total_amount; }, 0);
        $('#stat-revenue').text('฿' + revenue.toLocaleString('th-TH', {minimumFractionDigits: 2}));
        $('#stat-orders').text(orders.length);

        renderOrdersChart(orders);
        renderRevenueChart(orders, parseInt(days));
        renderRecentOrders(orders);
    });

    api('GET', '/api/admin/products').done(function(data) {
        var products = data.data || [];
        $('#stat-products').text(products.length);
        renderProductsChart(products);
    });

    api('GET', '/api/admin/users').done(function(data) {
        var users = data.data || [];
        $('#stat-users').text(data.pagination ? data.pagination.total_items : users.length);
    });
}

function renderRevenueChart(orders, days) {
    var ctx = document.getElementById('revenueChart').getContext('2d');
    if (revenueChart) revenueChart.destroy();

    // Group revenue by date
    var dateMap = {};
    var today = new Date();
    for (var i = days - 1; i >= 0; i--) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        var key = d.toISOString().split('T')[0];
        dateMap[key] = 0;
    }

    orders.forEach(function(o) {
        var date = o.created_at ? o.created_at.split('T')[0] : '';
        if (dateMap.hasOwnProperty(date)) {
            dateMap[date] += o.total_amount;
        }
    });

    var labels = Object.keys(dateMap).map(function(d) {
        return d.substring(5); // MM-DD
    });
    var values = Object.values(dateMap);

    revenueChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Revenue (฿)',
                data: values,
                borderColor: '#4F46E5',
                backgroundColor: 'rgba(79, 70, 229, 0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: labels.length <= 31, grid: { display: false } },
                y: { beginAtZero: true }
            }
        }
    });
}

function renderOrdersChart(orders) {
    var ctx = document.getElementById('ordersChart').getContext('2d');
    if (ordersChart) ordersChart.destroy();

    var statusCount = { pending: 0, confirmed: 0, shipped: 0, delivered: 0, cancelled: 0 };
    orders.forEach(function(o) {
        if (statusCount.hasOwnProperty(o.status)) statusCount[o.status]++;
    });

    ordersChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Pending', 'Confirmed', 'Shipped', 'Delivered', 'Cancelled'],
            datasets: [{
                data: [statusCount.pending, statusCount.confirmed, statusCount.shipped, statusCount.delivered, statusCount.cancelled],
                backgroundColor: ['#F59E0B', '#3B82F6', '#8B5CF6', '#10B981', '#EF4444']
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } }
        }
    });
}

function renderProductsChart(products) {
    var ctx = document.getElementById('productsChart').getContext('2d');
    if (productsChart) productsChart.destroy();

    // Top 10 products by stock
    var sorted = products.slice().sort(function(a, b) { return b.stock_quantity - a.stock_quantity; }).slice(0, 10);
    var labels = sorted.map(function(p) { return p.name.length > 15 ? p.name.substring(0, 15) + '...' : p.name; });
    var values = sorted.map(function(p) { return p.stock_quantity; });

    productsChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Stock',
                data: values,
                backgroundColor: '#8B5CF6'
            }]
        },
        options: {
            responsive: true,
            indexAxis: 'y',
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true } }
        }
    });
}

function renderRecentOrders(orders) {
    var recent = orders.slice(0, 5);
    if (recent.length === 0) {
        $('#recent-orders').html('<p class="text-gray-400 text-sm">No orders yet.</p>');
        return;
    }

    var html = '';
    recent.forEach(function(o) {
        var statusColor = {
            pending: 'bg-yellow-100 text-yellow-800',
            confirmed: 'bg-blue-100 text-blue-800',
            shipped: 'bg-purple-100 text-purple-800',
            delivered: 'bg-green-100 text-green-800',
            cancelled: 'bg-red-100 text-red-800'
        }[o.status] || 'bg-gray-100 text-gray-800';

        html += '<div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">';
        html += '<div class="flex-1 min-w-0">';
        html += '<p class="text-sm font-medium text-gray-900 truncate">' + (o.user_email || 'Guest') + '</p>';
        html += '<p class="text-xs text-gray-500">' + (o.created_at || '').split('T')[0] + '</p>';
        html += '</div>';
        html += '<div class="flex items-center gap-2 ml-3">';
        html += '<span class="px-2 py-0.5 text-xs font-medium rounded-full ' + statusColor + '">' + o.status + '</span>';
        html += '<span class="text-sm font-bold text-gray-900">฿' + o.total_amount.toFixed(0) + '</span>';
        html += '</div></div>';
    });
    $('#recent-orders').html(html);
}
</script>
