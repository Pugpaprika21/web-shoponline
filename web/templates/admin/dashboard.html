<!-- Dashboard Stats -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-gray-500 text-sm font-medium">Total Products</h3>
        <p class="text-3xl font-bold text-gray-900 mt-2" id="total-products">-</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-gray-500 text-sm font-medium">Total Orders</h3>
        <p class="text-3xl font-bold text-gray-900 mt-2" id="total-orders">-</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-gray-500 text-sm font-medium">Revenue</h3>
        <p class="text-3xl font-bold text-gray-900 mt-2" id="total-revenue">฿0.00</p>
    </div>
</div>

<!-- Quick Actions -->
<div class="bg-white rounded-lg shadow p-6 mb-8">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Quick Actions</h3>
    <div class="flex flex-wrap gap-4">
        <a href="/admin/products" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm font-medium">
            Manage Products
        </a>
        <a href="/admin/inventory" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium">
            Manage Inventory
        </a>
        <a href="/admin/orders" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition text-sm font-medium">
            View Orders
        </a>
        <a href="/admin/settings/roles" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition text-sm font-medium">
            Manage Roles
        </a>
    </div>
</div>

<script>
$(document).ready(function() {
    $.getJSON('/api/admin/products', function(data) {
        var products = data.data || [];
        $('#total-products').text(products.length);
    });
    $.getJSON('/api/admin/orders', function(data) {
        var orders = data.data || [];
        $('#total-orders').text(orders.length);
        var revenue = orders.reduce(function(sum, order) {
            return sum + order.total_amount;
        }, 0);
        $('#total-revenue').text('฿' + revenue.toFixed(2));
    });
});
</script>
